name: veil-prof
on:
  workflow_dispatch:
    inputs:
      art_run: {required: true, type: string}
      n: {required: false, default: "[0,1,2,3,4,5]", type: string}
      cfgs: {required: false, default: "G_off S_on S_off G_on G_on_na G_off_mlock S_on_host", type: string}
      intel_only: {required: false, default: "1", type: string}
      cfgsa: {required: false, default: "A_on A_off_na A_host A_k6_on A_on_invtsc C_memfd C_uffd", type: string}
permissions: {contents: read, actions: read}
jobs:
  prof:
    strategy: {fail-fast: false, matrix: {gidx: "${{ fromJSON(inputs.n) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: gvm, path: art, run-id: "${{ inputs.art_run }}", github-token: "${{ github.token }}"}
      - name: profile
        env: {GIDX: "${{ matrix.gidx }}", CFGS: "${{ inputs.cfgs }}", CFGSA: "${{ inputs.cfgsa }}", INTEL_ONLY: "${{ inputs.intel_only }}"}
        run: |
          if [ "$INTEL_ONLY" = 1 ] && ! grep -qw vmx /proc/cpuinfo; then echo "VEIL_JSON {\"kind\":\"skip_amd\",\"cpu\":\"$(lscpu | sed -n 's/Model name: *//p' | head -1)\"}"; exit 0; fi
          if [ "${IN_DOCKER:-1}" = 1 ]; then
            # runner apt mirrors were timing out (prof1/prof2); get QEMU+toolchain from a Docker Hub ubuntu:24.04 image instead
            sudo sysctl -qw vm.unprivileged_userfaultfd=1; sudo modprobe vhost_net || true
            docker run --rm --privileged --network host -v /dev:/dev -v /boot:/boot:ro -v /sys/kernel/debug:/sys/kernel/debug -v $GITHUB_WORKSPACE:/w -w /w -e GIDX -e CFGS -e CFGSA ubuntu:24.04 bash -c 'export DEBIAN_FRONTEND=noninteractive; echo STEP docker-apt; timeout 600 apt-get -qq update >/dev/null 2>&1; timeout 900 apt-get -qq install -y --no-install-recommends sudo qemu-system-x86 qemu-utils busybox-static cpio gcc libc6-dev python3 util-linux kmod iproute2 gawk >/dev/null 2>&1; echo "STEP docker-apt rc=$? $(qemu-system-x86_64 --version | head -1)"; bash gha/gvm_prof.sh'
          else bash gha/gvm_prof.sh; fi
