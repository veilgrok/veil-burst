name: veil-vsplit
on:
  workflow_dispatch:
    inputs:
      relay_url: {required: true, type: string}
      art_run: {required: false, default: "repo", type: string}
      n: {required: false, default: "[0,1,2,3,4,5]", type: string}
      modes: {required: false, default: "S1 S2 X", type: string}
      eptad: {required: false, default: "0", type: string}
permissions: {contents: read, actions: read}
jobs:
  node:
    strategy: {fail-fast: false, matrix: {gidx: "${{ fromJSON(inputs.n) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - if: inputs.art_run == 'repo'
        run: mkdir -p art && cp gha/bin/gvm/l2root.tar.gz gha/bin/gvm/bzImage art/
      - if: inputs.art_run != 'repo'
        uses: actions/download-artifact@v4
        with: {name: gvm, path: art, run-id: "${{ inputs.art_run }}", github-token: "${{ github.token }}"}
      - name: vcpu split
        env:
          GIDX: ${{ matrix.gidx }}
          NN: ${{ strategy.job-total }}
          MODES: ${{ inputs.modes }}
          VEIL_RELAY_URL: ${{ inputs.relay_url }}
          VEIL_RELAY_TOKEN: ${{ secrets.VEIL_RELAY_TOKEN }}
        run: |
          sudo sysctl -qw vm.unprivileged_userfaultfd=1; sudo modprobe wireguard || true
          # Intel: EPT A/D makes guest page-table walks count as writes -> page-table pages ping-pong in DSM; turn it off
          if grep -qw vmx /proc/cpuinfo && [ "${{ inputs.eptad }}" = 0 ]; then sudo modprobe -r kvm_intel && sudo modprobe kvm_intel eptad=0; echo "eptad=$(cat /sys/module/kvm_intel/parameters/eptad)"; fi
          sudo chmod 666 /dev/kvm
          docker run --rm --privileged --network host -v /dev:/dev -v /sys/module:/sys/module:ro -v $GITHUB_WORKSPACE:/w -w /w -e GIDX -e NN -e MODES -e GITHUB_RUN_ID -e VEIL_RELAY_URL -e VEIL_RELAY_TOKEN debian:trixie bash -c 'export DEBIAN_FRONTEND=noninteractive; timeout 600 apt-get -qq update >/dev/null 2>&1; timeout 900 apt-get -qq install -y --no-install-recommends qemu-system-x86 cpio gcc libc6-dev python3 util-linux iproute2 iputils-ping wireguard-tools curl ca-certificates procps >/dev/null 2>&1; echo "STEP docker-apt rc=$? $(qemu-system-x86_64 --version | head -1)"; bash gha/vsplit.sh'
