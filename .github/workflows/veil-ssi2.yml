name: veil-ssi2
on:
  workflow_dispatch:
    inputs:
      relay_url: {required: true, type: string}
      n: {required: false, default: "[0,1,2,3,4,5,6,7]", type: string}
      npeers: {required: false, default: "8", type: string}
permissions: {contents: read}
jobs:
  kbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash gha/ssi2_kbuild.sh
      - uses: actions/upload-artifact@v4
        with: {name: bzImage, path: out/bzImage, retention-days: 1}
  qbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash gha/ssi2_qbuild.sh
  sample:
    needs: kbuild
    if: always()
    strategy: {fail-fast: false, matrix: {gidx: "${{ fromJSON(inputs.n) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: bzImage, path: art}
      - name: sample
        env:
          GIDX: ${{ matrix.gidx }}
          NPEERS: ${{ inputs.npeers }}
          VEIL_RELAY_URL: ${{ inputs.relay_url }}
          VEIL_RELAY_TOKEN: ${{ secrets.VEIL_RELAY_TOKEN }}
        run: bash gha/ssi2_sample.sh
