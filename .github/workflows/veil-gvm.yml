name: veil-gvm
on:
  workflow_dispatch:
    inputs:
      relay_url: {required: true, type: string}
      art_run: {required: false, default: "", type: string}
      n: {required: false, default: "[0,1,2,3,4,5,6,7]", type: string}
      nnodes: {required: false, default: "8", type: string}
      l3args: {required: false, default: "", type: string}
      solo: {required: false, default: "0", type: string}
      pick: {required: false, default: "0", type: string}
      wgmtu: {required: false, default: "1420", type: string}
      reqintel: {required: false, default: "0", type: string}
permissions: {contents: read, actions: read}
jobs:
  build:
    if: inputs.art_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash gha/gvm_build.sh
      - uses: actions/upload-artifact@v4
        with: {name: gvm, path: out/, retention-days: 1}
  node:
    needs: build
    if: always()
    strategy: {fail-fast: false, matrix: {gidx: "${{ fromJSON(inputs.n) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: gvm, path: art, run-id: "${{ inputs.art_run || github.run_id }}", github-token: "${{ github.token }}"}
      - name: bare-metal baseline
        run: gcc -O2 -pthread -o pb gha/pbench.c && ./pb 1 10000000 && ./pb $(nproc) 10000000
      - name: gvm node
        env:
          GIDX: ${{ matrix.gidx }}
          NNODES: ${{ inputs.nnodes }}
          L3ARGS: ${{ inputs.l3args }}
          SOLO: ${{ inputs.solo }}
          PICK: ${{ inputs.pick }}
          WGMTU: ${{ inputs.wgmtu }}
          REQINTEL: ${{ inputs.reqintel }}
          BASEFIRST: ${{ inputs.reqintel }}
          L2T: ${{ inputs.reqintel == '1' && '2900' || (inputs.solo == '1' || inputs.pick == '1') && '2300' || '1000' }}
          WATCHT: ${{ inputs.reqintel == '1' && '45 150 300 450 600 750 900 1050 1200 1350 1500 1650 1800 1950 2100 2250 2400' || (inputs.solo == '1' || inputs.pick == '1') && '45 150 300 450 600 750 900 1050 1200 1350 1500 1650 1800' || '45 150 300 450 600 750' }}
          VEIL_RELAY_URL: ${{ inputs.relay_url }}
          VEIL_RELAY_TOKEN: ${{ secrets.VEIL_RELAY_TOKEN }}
        run: bash gha/gvm_node.sh
