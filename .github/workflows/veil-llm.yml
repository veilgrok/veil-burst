# veil-llm: one LLM sharded across N runners (pipeline and tensor layouts), measured end to end.
# Dispatch only. Relay token is an existing Actions secret (used only for address rendezvous).
name: Veil LLM shard
on:
  workflow_dispatch:
    inputs:
      relay_url: {description: Veil relay URL, required: true, type: string}
      n: {description: JSON matrix indices, required: false, default: "[0,1,2,3,4,5,6,7]", type: string}
      npeers: {required: false, default: "8", type: string}
      models: {description: models that fit one runner, required: false, default: "s1,m7", type: string}
      big: {description: models bigger than one runner, required: false, default: "l34,l70", type: string}
      prompt: {required: false, default: "64", type: string}
      gen: {required: false, default: "32", type: string}
      tag: {required: false, default: "", type: string}
run-name: "Veil LLM ${{ inputs.tag }}"
permissions: {contents: read}
jobs:
  llm:
    strategy: {fail-fast: false, matrix: {gidx: "${{ fromJSON(inputs.n) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: llm
        env:
          GIDX: ${{ matrix.gidx }}
          NPEERS: ${{ inputs.npeers }}
          LLM_MODELS: ${{ inputs.models }}
          LLM_BIG: ${{ inputs.big }}
          LLM_PROMPT: ${{ inputs.prompt }}
          LLM_GEN: ${{ inputs.gen }}
          VEIL_RELAY_URL: ${{ inputs.relay_url }}
          VEIL_RELAY_TOKEN: ${{ secrets.VEIL_RELAY_TOKEN }}
        run: timeout 5000 python3 gha/llm/llm_runner.py
